<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lazio Fungi Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:system-ui,-apple-system,sans-serif}#map{background:#dce3df}.panel{position:absolute;z-index:1000;top:12px;left:12px;width:min(355px,calc(100% - 24px));background:#fffffff2;border-radius:16px;padding:13px;box-shadow:0 5px 24px #0005;color:#183126}.panel h1{font-size:18px;margin:0 0 4px}.muted{font-size:11px;color:#68756d;line-height:1.35}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}label{font-size:11px;font-weight:700}select{width:100%;margin-top:3px;padding:9px;border:1px solid #d8dfda;border-radius:9px;background:#fff}.info{position:absolute;z-index:1000;right:12px;bottom:18px;width:min(330px,calc(100% - 24px));background:#fffffff4;border-radius:16px;padding:13px;box-shadow:0 5px 24px #0005;display:none}.score{font-size:32px;font-weight:900}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.m{background:#f0f4f1;border-radius:8px;padding:7px;font-size:10px}.m b{display:block;font-size:13px;margin-top:2px}.status{margin-top:8px;font-size:11px;color:#68756d}.legend{height:7px;border-radius:8px;background:linear-gradient(90deg,#a33e36,#d3a83c,#a7ba55,#2e7549);margin-top:8px}@media(max-width:650px){.panel{top:8px;left:8px;width:calc(100% - 16px)}.info{right:8px;bottom:8px;width:calc(100% - 16px)}}</style></head><body><div id="map"></div>
<div class="panel"><h1>🍄 Lazio Fungi Map</h1><div class="muted">Satellite + boschi. Tocca un'area boschiva per analizzarla.</div><div class="row"><div><label>Fungo</label><select id="species"><option value="porcino">Porcino</option><option value="ovulo">Ovulo buono</option><option value="finferlo">Finferlo</option><option value="chiodino">Chiodino</option></select></div><div><label>Pioggia</label><select id="days"><option>3</option><option>7</option><option selected>10</option><option>14</option></select></div></div><div class="legend"></div><div class="status" id="status">Mappa pronta. I boschi sono il layer colorato sopra il satellite.</div></div>
<div class="info" id="info"><b id="name">Area boschiva</b><div><span class="score" id="score">—</span>/100 <span class="muted">indice di favorevolezza</span></div><div class="metrics"><div class="m">Pioggia<b id="rain">—</b></div><div class="m">Quota<b id="elev">—</b></div><div class="m">Pendenza<b id="slope">—</b></div><div class="m">Esposizione<b id="aspect">—</b></div><div class="m">Temperatura<b id="temp">—</b></div><div class="m">Bosco<b id="forest">—</b></div></div><div class="muted" id="why" style="margin-top:8px"></div></div>
<script>
const W='https://geoportale.regione.lazio.it/geoserver/ows';
const map=L.map('map').setView([41.85,12.75],8);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri World Imagery'}).addTo(map);
const forestWMS=L.tileLayer.wms(W,{layers:'geonode:tipi_forestali2',format:'image/png',transparent:true,opacity:.48,attribution:'Regione Lazio — Carta forestale'}).addTo(map);
L.control.layers({}, {'Carta forestale':forestWMS},{collapsed:true}).addTo(map);
let selected=null;
const profiles={porcino:{r:[25,75],t:[12,21]},ovulo:{r:[18,60],t:[18,27]},finferlo:{r:[30,90],t:[11,20]},chiodino:{r:[25,85],t:[10,20]}};
function clamp(x){return Math.max(0,Math.min(1,x))} function bell(x,a,b){if(x>=a&&x<=b)return 1;let s=Math.max(8,(b-a)*.75);return clamp(x<a?1-(a-x)/s:1-(x-b)/s)}
function compass(d){return ['N','NE','E','SE','S','SO','O','NO'][Math.round(d/45)%8]}
function habitat(name){name=(name||'').toLowerCase();if(/fag|cast/.test(name))return .95;if(/cerr|querc|rover/.test(name))return .88;if(/carp|pin|conif/.test(name))return .75;if(/lecc/.test(name))return .6;return .55}
async function weather(lat,lon,days){let u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&past_days=14&forecast_days=1&daily=precipitation_sum,temperature_2m_mean&timezone=auto`;let d=await (await fetch(u)).json();let p=d.daily.precipitation_sum||[],t=d.daily.temperature_2m_mean||[];let rain=p.slice(-(days+1),-1).reduce((a,b)=>a+(b||0),0), tt=t.slice(-(days+1),-1).filter(Number.isFinite);return{rain,temp:tt.reduce((a,b)=>a+b,0)/(tt.length||1)}}
async function terrain(lat,lon){let d=.0045,pts=[[lat,lon],[lat+d,lon],[lat-d,lon],[lat,lon+d],[lat,lon-d]],u='https://api.open-meteo.com/v1/elevation?latitude='+pts.map(x=>x[0]).join(',')+'&longitude='+pts.map(x=>x[1]).join(',');let z=(await (await fetch(u)).json()).elevation;if(!z||z.length<5)return{};let ns=(z[1]-z[2])/(2*d*111000),ew=(z[3]-z[4])/(2*d*111000*Math.cos(lat*Math.PI/180)),s=Math.atan(Math.hypot(ns,ew))*180/Math.PI,a=(Math.atan2(-ew,-ns)*180/Math.PI+360)%360;return{elev:z[0],slope:s,aspect:a}}
async function feature(lat,lon){let b=[lon-.015,lat-.015,lon+.015,lat+.015].join(','),u=W+'?service=WFS&version=1.0.0&request=GetFeature&typeName=geonode:tipi_forestali2&outputFormat=application/json&srsName=EPSG:4326&bbox='+b+',EPSG:4326&maxFeatures=5';let g=await (await fetch(u)).json();return g.features?.[0]||null}
function fname(p){let a=Object.values(p||{}).filter(x=>typeof x==='string'&&x.length>3);return a.find(x=>/fag|cast|cerr|querc|lecc|carp|pin|bos|forest/i.test(x))||a[0]||'Formazione forestale'}
map.on('click',async e=>{let s=document.getElementById('status');s.textContent='Analisi in corso…';try{let days=+document.getElementById('days').value,sp=document.getElementById('species').value,[f,w,t]=await Promise.all([feature(e.latlng.lat,e.latlng.lng),weather(e.latlng.lat,e.latlng.lng,days),terrain(e.latlng.lat,e.latlng.lng)]);if(!f){s.textContent='Nessuna area forestale trovata qui. Tocca un bosco colorato.';return}if(selected)map.removeLayer(selected);selected=L.geoJSON(f,{style:{color:'#fff',weight:3,fillColor:'#39a45a',fillOpacity:.25}}).addTo(map);let n=fname(f.properties),h=habitat(n),p=profiles[sp],rs=bell(w.rain,...p.r),ts=bell(w.temp,...p.t),north=(1+Math.cos((t.aspect||0)*Math.PI/180))/2,as=.72+.18*north,ss=t.slope==null?.75:t.slope<5?.78:t.slope<=25?1:t.slope<=40?.85:.65,recent=.52*rs+.25*ts+.13*as+.10*ss,score=Math.round(100*clamp((.28+.72*h)*recent));document.getElementById('name').textContent=n;document.getElementById('score').textContent=score;document.getElementById('rain').textContent=w.rain.toFixed(1)+' mm / '+days+' gg';document.getElementById('elev').textContent=t.elev==null?'—':Math.round(t.elev)+' m';document.getElementById('slope').textContent=t.slope==null?'—':t.slope.toFixed(0)+'°';document.getElementById('aspect').textContent=t.aspect==null?'—':compass(t.aspect);document.getElementById('temp').textContent=w.temp.toFixed(1)+' °C';document.getElementById('forest').textContent=Math.round(h*100)+'/100';document.getElementById('why').textContent=(h>.8?'Habitat forestale favorevole':'Habitat forestale moderato')+' · '+(rs>.8?'piogge favorevoli':'piogge non ottimali')+'. Indice ecologico, non probabilità statistica calibrata.';document.getElementById('info').style.display='block';s.textContent='Bosco selezionato. Tocca un altro bosco per confrontarlo.'}catch(err){console.error(err);s.textContent='Uno dei servizi dati non ha risposto. La mappa satellitare deve comunque restare visibile.'}});
</script></body></html>
